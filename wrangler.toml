name = "movimiento"
compatibility_date = "2025-06-01"
pages_build_output_dir = "./dist"

[vars]
PDF_KEY = "movimiento-web.pdf"
# Enlaces de aporte (D3)
CAFECITO_URL = "https://cafecito.app/movimientolibro"
MERCADOPAGO_URL = "https://link.mercadopago.com.ar/movimientolibro"

# TURNSTILE_SECRET es un secreto: `.dev.vars` en local, variable cifrada en Pages.

[[d1_databases]]
binding = "DB"
database_name = "movimiento"
# PENDIENTE: id real tras `wrangler d1 create movimiento`
database_id = "c5ccf458-3ba8-41e2-94c8-1569ea684d16"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "LIBRO"
bucket_name = "movimiento-libro"
